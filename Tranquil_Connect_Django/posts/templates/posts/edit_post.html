<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Publicación | Tranquil Connect</title>
    <style>
        body { font-family: sans-serif; background: #f8faff; display: flex; justify-content: center; padding: 50px; }
        .edit-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #4a90e2; }
        textarea { width: 100%; height: 100px; margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-save { background: #4a7cf5; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-cancel { color: #666; text-decoration: none; margin-left: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="edit-card">
        <h2>Editar Publicación #{{ post.id }}</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Contenido de la publicación:</label>
            <textarea name="contenido">{{ post.contenido }}</textarea>
            
            <label>Cambiar imagen (opcional):</label>
            <input type="file" name="imagen" style="margin-top: 10px;">
            
            <div style="margin-top: 25px;">
                <button type="submit" class="btn-save">Guardar Cambios</button>
                <a href="{% url 'admin_posts_list' %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
