# CONFIGURACIÓN DE PUERTO
server.port=8090

# 1. CONEXIÓN A DB - USANDO MYSQL LOCAL
# Cambiamos 'mysql' por 'localhost'
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# IMPORTANTE: Asegúrate de que esta sea la contraseña que pusiste al instalar MySQL en Windows
spring.datasource.password=

# 2. CONFIGURACIÓN DE JPA/HIBERNATE
# Cambia de 'update' a 'validate' o 'none'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Nota: Si usas una versión reciente de Hibernate, es posible que no necesites especificar el dialecto.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# CONFIGURACIÓN DEL SERVIDOR DE CORREO
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tranquilconnectofficial@gmail.com
spring.mail.password=ngzasspugazwwkxe 

# Protocolos de seguridad
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Límites de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Agrega esto a tu application.properties
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true