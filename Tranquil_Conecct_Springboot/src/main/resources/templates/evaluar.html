<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluar Paciente - Tranquil Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Nueva Evaluación</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/evaluacion/guardar}" method="post">
                <input type="hidden" name="pacienteId" th:value="${paciente.id}">
                
                <div class="mb-3">
                    <label class="form-label">Paciente:</label>
                    <input type="text" class="form-control" th:value="${paciente.nombre}" readonly>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Calificación (0-100)</label>
                    <input type="number" name="calificacion" class="form-control" min="0" max="100" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Condición / Diagnóstico</label>
                    <input type="text" name="condicion" class="form-control" placeholder="Ej: Ansiedad">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea name="descripcion" class="form-control" rows="4"></textarea>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="/dashboard-psicologo" class="btn btn-secondary">Volver</a>
                    <button type="submit" class="btn btn-success">Guardar Evaluación</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
