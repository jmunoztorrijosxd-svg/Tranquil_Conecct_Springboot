<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con Tarjeta</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;
            background:white;
            padding:30px;
            border-radius:16px;
            box-shadow:0 4px 20px rgba(0,0,0,.1);
        }

        h1{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#3483fa;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#2968c8;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Pago con Tarjeta</h1>

    <form th:action="@{/confirmar-cita}" method="post">

        <input type="hidden" name="metodoPago" value="tarjeta">

        <label>Número de tarjeta</label>
        <input type="text"
               name="numeroTarjeta"
               maxlength="16"
               minlength="16"
               pattern="[0-9]{16}"
               required>

        <label>Nombre del titular</label>
        <input type="text"
               name="titular"
               required>

        <label>Fecha de vencimiento</label>
        <input type="month"
               name="vencimiento"
               required>

        <label>CVV</label>
        <input type="password"
               name="cvv"
               maxlength="4"
               minlength="3"
               pattern="[0-9]{3,4}"
               required>

        <button type="submit">
            Confirmar cita
        </button>

    </form>

</div>

</body>
</html>
